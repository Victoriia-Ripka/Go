<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator 2</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px;
      }
      .button {
        font-size: 18px;
        font-weight: bold;
        padding: 10px 20px;
        margin: 10px;
        cursor: pointer;
        border: 2px solid #007bff;
        background-color: #007bff;
        color: white;
        border-radius: 5px;
      }
      .button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <h1>Завдання 2</h1>
    <h3>
        Розрахунок збитків від перерв електропостачання
    </h3>

    <form method="POST">
      <button class="button" type="submit">Розрахувати</button>
    </form>
    <br />
    <button class="button" onclick="window.location.href='/'">
      Повернутися назад
    </button>
    <br />

    {{if .Result}}
    <p>
      Математичне сподівання збитків від переривання електропостачання:
      {{.Result}}
    </p>
    {{else}}
    <p>Натисніть "Розрахувати" для отримання результатів.</p>
    {{end}}
  </body>
</html>
