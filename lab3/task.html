<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
          font-family: Arial, sans-serif;
          margin: 20px;
          padding: 20px;
        }
        h1 {
          text-align: center;
        }
        form {
          max-width: 400px;
          margin: 0 auto;
          padding: 15px;
          border: 1px solid #ddd;
          border-radius: 8px;
          background: #f9f9f9;
        }
        label {
          font-weight: bold;
          display: block;
          margin-top: 10px;
        }
        input {
          width: 100%;
          padding: 8px;
          margin-top: 5px;
          border: 1px solid #ccc;
          border-radius: 5px;
        }
        textarea {
          width: 100%;
          height: 50px;
          padding: 8px;
          border: 1px solid #ccc;
          border-radius: 5px;
        }
        table {
          width: 100%;
          margin-top: 20px;
          border-collapse: collapse;
        }
        th,
        td {
          padding: 10px;
          border: 1px solid #ddd;
          text-align: center;
        }
        th {
          background: #f0f0f0;
        }
      </style>
</head>
<body>

</body>
</html>
