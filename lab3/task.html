<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розрахунок прибутку</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          margin: 20px;
          padding: 20px;
        }
        h1 {
          text-align: center;
        }
        form {
          max-width: 400px;
          margin: 0 auto;
          padding: 15px;
          border: 1px solid #ddd;
          border-radius: 8px;
          background: #f9f9f9;
        }
        label {
          font-weight: bold;
          display: block;
          margin-top: 10px;
        }
        input {
          width: 100%;
          padding: 8px;
          margin-top: 5px;
          border: 1px solid #ccc;
          border-radius: 5px;
        }
        textarea {
          width: 100%;
          height: 50px;
          padding: 8px;
          border: 1px solid #ccc;
          border-radius: 5px;
        }
        table {
          width: 100%;
          margin-top: 20px;
          border-collapse: collapse;
        }
        th,
        td {
          padding: 10px;
          border: 1px solid #ddd;
          text-align: center;
        }
        th {
          background: #f0f0f0;
        }
      </style>
</head>
<body>
  <h1>Розрахунок прибутку</h1>
  <form method="post">
      <label for="Pc">Середньодобова потужність (ГДж):</label>
      <input type="text" id="Pc" name="Pc">
      <span id="error_text1" style="color: red;"></span>
      <br>
      <label for="sigma">Середньоквадратичне відхилення:</label>
      <input type="text" id="sigma" name="sigma">
      <span id="error_text2" style="color: red;"></span>
      <br>
      <label for="B">Вартість:</label>
      <input type="text" id="B" name="B">
      <span id="error_text3" style="color: red;"></span>
      <br>
      <button type="submit">Розрахувати</button>
      <button type="reset">Скинути</button>
  </form>
  
  {{if .Success}}
  <h2>Результати:</h2>
  <p>Прибуток становитиме: {{.Profit}} грн</p>
  {{end}}
</body>
</html>
